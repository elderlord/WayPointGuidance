<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>기묘한 국중곽 : 21세기 도깨비</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0d0b14; --screen:#1a1726; --card:#221d33;
    --gold:#c9a84a; --gold-dim:#8f7a3a;
    --ink:#f0ead9; --lav:#d9d2ee; --lav-2:#9a8fc0; --lav-3:#8a7fb5; --lav-4:#6f6690;
    --line:#35304a; --sci:#7fd8b0; --sci-bg:#1f2b28; --sci-line:#2c4a3f; --sci-btn:#243a34;
    --voice:'Gowun Batang','Nanum Myeongjo','Batang',serif;
    --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--lav);font-family:var(--ui);-webkit-text-size-adjust:100%}
  body{min-height:100dvh;display:flex;justify-content:center}
  #app{width:100%;max-width:440px;min-height:100dvh;background:var(--screen);
    padding:22px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}

  /* --- shared bits --- */
  .top{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px}
  .brand{font-size:11px;letter-spacing:.14em;color:var(--gold);margin:0}
  .sound{font-size:11px;color:var(--lav-3);display:inline-flex;gap:5px;align-items:center}
  .sound::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block}

  .bar-wrap{margin:0 0 22px}
  .bar-key{display:flex;justify-content:space-between;font-size:11px;color:var(--lav-4);margin:0 0 6px}
  .bar-key .sci{color:var(--sci)}
  .bar{height:8px;border-radius:4px;background:#2f2a40;overflow:hidden}
  .bar>span{display:block;height:100%;width:12%;background:var(--sci);border-radius:4px;transition:width .9s cubic-bezier(.2,.7,.2,1)}

  .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--lav-3);margin:0 0 6px}
  h1.title{font-family:var(--voice);font-size:26px;font-weight:700;color:var(--ink);margin:4px 0 18px;line-height:1.3}

  /* dokkaebi voice */
  .voice{background:var(--card);border-left:2px solid var(--gold);padding:15px 16px;margin:0 0 14px;
    animation:rise .5s ease both}
  .voice p{font-family:var(--voice);font-size:16px;line-height:1.9;color:var(--lav);margin:0}
  .aside{font-family:var(--voice);font-size:14px;font-style:italic;color:var(--lav-3);margin:12px 0 0;line-height:1.7}

  /* tale (괴담 서사) */
  .tale-label{font-size:11px;letter-spacing:.12em;color:var(--lav-4);margin:18px 0 6px}
  .tale{font-family:var(--voice);font-size:15px;line-height:1.85;color:var(--lav);margin:0}

  /* onsite placeholder */
  .onsite{font-size:12px;line-height:1.6;color:var(--lav-3);background:#161226;border:0.5px dashed var(--line);
    border-radius:8px;padding:10px 12px;margin:14px 0 0}
  .onsite b{color:var(--gold);font-weight:400}

  /* field */
  .field{margin:22px 0 0}
  .flabel{font-size:13px;color:var(--lav-2);margin:0 0 8px}
  .finput{width:100%;background:var(--bg);border:0.5px solid var(--line);border-radius:8px;color:var(--ink);
    padding:12px 14px;font-size:15px;font-family:var(--ui)}
  .finput::placeholder{color:#5a5273}
  .finput:focus{outline:none;border-color:var(--gold)}

  /* mission */
  .mission{margin:20px 0 0}
  .m-q{font-size:14.5px;color:var(--sci);margin:0 0 12px;font-weight:500}
  .opt{display:block;width:100%;text-align:left;background:var(--sci-btn);border:0.5px solid var(--sci-line);
    border-radius:8px;color:#cfe8dd;padding:12px 14px;font-size:14px;margin:0 0 9px;cursor:pointer;font-family:var(--ui);
    transition:background .15s,border-color .15s}
  .opt:hover{background:#2b463e}
  .opt:disabled{cursor:default;opacity:.5}
  .opt.right{background:#204a3a;border-color:var(--sci);color:#dff3ea}
  .opt.wrong{background:#3a2330;border-color:#6e3a4c;color:#e8c6d3;opacity:1}

  /* reveal (규명 + 반응) — hidden until answered */
  .reveal-box{margin:16px 0 0;display:none}
  .reveal-box.show{display:block;animation:rise .5s ease both}
  .r-label{font-size:11px;letter-spacing:.12em;color:var(--sci);margin:0 0 6px}
  .reveal{background:var(--card);border-left:2px solid var(--sci);padding:13px 14px;font-size:14px;
    line-height:1.75;color:#c4bcdd;margin:0 0 14px}
  .react{background:var(--card);border-left:2px solid var(--gold);padding:13px 14px;margin:0 0 14px}
  .react p{font-family:var(--voice);font-size:15px;line-height:1.85;color:var(--lav);margin:0;font-style:italic}
  .next-clue{font-size:13px;line-height:1.7;color:var(--lav-2);border-top:0.5px dashed var(--line);padding-top:14px;margin:0 0 16px}
  .next-clue b{color:var(--gold);font-weight:400}

  /* result / badge / code (finale) */
  .result{text-align:center;margin:0 0 18px}
  .result .rl{font-size:11px;letter-spacing:.14em;color:var(--lav-3);margin:0 0 6px}
  .result .rt{font-size:15px;line-height:1.75;color:var(--lav);margin:0}
  .result .rt b{color:var(--gold);font-weight:500}
  .badge{text-align:center;background:var(--sci-bg);border:0.5px solid var(--sci-line);border-radius:14px;
    padding:20px 16px;margin:0 0 16px}
  .badge .crown{font-size:30px;line-height:1}
  .badge .bt{font-size:19px;font-weight:500;color:var(--sci);margin:8px 0 2px}
  .badge .bn{font-size:13px;color:var(--lav-2);margin:0}
  .code{text-align:center;background:var(--bg);border:0.5px dashed var(--gold);border-radius:10px;padding:15px;margin:0 0 8px}
  .code .cl{font-size:11px;letter-spacing:.14em;color:var(--lav-3);margin:0 0 6px}
  .code .cv{font-size:23px;font-weight:700;letter-spacing:.22em;color:var(--ink);margin:0;font-family:ui-monospace,monospace}
  .gift{font-size:12px;line-height:1.6;color:var(--lav-3);text-align:center;margin:0}

  /* primary button */
  .cta{width:100%;margin-top:18px;background:var(--gold);border:none;border-radius:10px;color:#1a1726;
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--ui)}
  .cta:disabled{background:#3a3550;color:#6f6690;cursor:default}
  .hint{text-align:center;font-size:11px;color:var(--lav-4);margin:12px 0 0}

  .spacer{flex:1}
  .restart{background:none;border:none;color:var(--lav-4);font-size:12px;padding:8px;margin:18px auto 0;
    cursor:pointer;font-family:var(--ui);text-decoration:underline;text-underline-offset:3px}

  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
/* =========================================================================
   대사 · 콘텐츠 데이터  —  여기만 고치면 이야기가 바뀝니다.
   각 노드: 도깨비 도발(taunt) → 괴담 서사(tale) → 미션(선택) → 규명(reveal)
            → 도깨비 반응(react) → 다음 단서(nextClue)
   ========================================================================= */
const NODES = [
  {
    eyebrow: "제보 01 · 도깨비불",
    title: "밤길을 따라오는 불빛",
    taunt: "…보이느냐. 밤길을 밟는 저 불빛이. 다가가면 물러나고, 멈추면 함께 멈추지. 저것이 바로 나, 도깨비니라. 홀리기 전에 어서 도망치는 게 어떠냐?",

    question: "저 불빛의 정체는 무엇이냐?",
    options: [
      { t: "땅에서 새어 나온 가스의 자연발화", correct: true },

    ],
    reveal: "무덤가와 습지에서 목격되던 도깨비불은, 땅속 생물이 썩으며 나온 메탄·인화수소 가스가 밤공기 중에 저절로 타오르는 현상일 가능성이 높습니다. 바람에 흔들리니 사람을 따라오는 것처럼 보였을 뿐입니다.",
    react: "흥, 그깟 불빛 하나 맞혔다고 우쭐대지 마라. …딱히 쉽게 내준 건 아니다만.",

  {

    title: "나를 부르는 낯선 소리",
    taunt: "쉿… 들리느냐? 아무도 없는데 네 이름을 부르는 소리. …아니, 귀로는 들리지 않겠지. 허나 네 가슴이 먼저 서늘해질 게다. 그것이 내 목소리다.",

    options: [
      { t: "귀에 들리지 않는 낮은 진동, 초저주파", correct: true },
      { t: "죽은 자가 귓가에 속삭이는 소리", correct: false },
      { t: "잘못 들린 귀울림(이명)", correct: false },
    ],
    reveal: "사람 귀에 들리지 않는 초저주파(20Hz 이하)는 바람이나 커다란 구조물 근처에서 생깁니다. 귀로는 못 들어도 몸이 반응해 까닭 모를 불안과 오싹함을 느끼게 되죠. ‘도깨비가 불렀다’던 그 느낌의 정체입니다.",
    react: "뭐, 뭐냐! 그 소리를 어찌 안 게야…! ……아, 아니다. 다음은 절대 못 푼다. 절대로.",
    nextClue: "이번엔 걸어보아라. 분명 앞으로만 걸었는데, 제자리로 돌아오게 되는 곳으로."
  },
  {
    eyebrow: "제보 03 · 도깨비 홀림",
    title: "같은 자리를 맴돌다",
    taunt: "크큭. 걸어보아라, 인간. 아무리 곧게 걷는다 한들, 넌 내 손바닥 안에서 빙빙 돌 뿐이니라.",
    tale: "분명히 앞으로만 걸었습니다. 그런데 눈을 떠보니 처음 그 자리. 밤새 도깨비가 나를 빙빙 돌렸다고, 사람들은 그렇게 말합니다.",

      { t: "볼 기준점이 없으면 몸이 한쪽으로 휘어 원을 그린다", correct: true },

      { t: "땅속 자기장이 방향을 어지럽혀서", correct: false },
    ],
    reveal: "사람은 눈으로 볼 기준점이 없으면 똑바로 걷지 못하고 한쪽으로 조금씩 휘어, 결국 원을 그립니다. 실험으로 증명된 현상이에요. 캄캄한 밤엔 기준점이 사라지니 ‘홀려서 맴돌았다’가 되는 겁니다.",
    react: "어, 어째서 안 홀리는 게냐! 치사하게 눈까지 감고선… 흥, 조금은 제법이구나. 아주 조금!",
    nextClue: "…마지막이다. 어둠 속에서 내 얼굴을 똑똑히 봤다는 자가 있는 곳으로 오너라."
  },
  {
    eyebrow: "제보 04 · 도깨비 형체",
    title: "어둠 속 그 얼굴",
    taunt: "여기까지 왔구나. 좋다, 똑똑히 보아라. 이 어둠 속 내 얼굴을. …고개를 돌리지 마라. 눈을 떼는 순간, 내가 널 따라갈 테니.",
    tale: "어둠 속, 무언가와 눈이 마주쳤습니다. 붉은 눈, 일그러진 얼굴. 고개를 돌리자… 그 얼굴이 흰 벽 위로 스윽 따라왔습니다.",
    onsite: "현장 체험 — 도깨비 얼굴 인쇄물을 30초간 응시한 뒤, 곁의 흰 벽으로 시선을 옮겨 떠오르는 잔상을 확인하세요.",
    question: "벽 위로 따라온 그 얼굴의 정체는 무엇이냐?",
    options: [
      { t: "오래 응시해 생긴 내 눈의 잔상(음성 잔상)", correct: true },
      { t: "벽에 깃들어 나를 따라온 진짜 도깨비", correct: false },
      { t: "우연히 벽에 남은 형체", correct: false },
    ],
    reveal: "한 곳을 오래 응시하면 눈 속 세포가 지쳐, 시선을 옮겼을 때 보색으로 반전된 상이 잠깐 떠오릅니다(음성 잔상). 어두우면 뇌가 애매한 형체를 자꾸 ‘얼굴’로 채워 넣는 성질(파레이돌리아)까지 겹쳐, ‘도깨비가 쫓아온다’가 되는 겁니다.",

/* 클라이맥스 · 담력왕 */
const FINALE = {
  eyebrow: "최후의 조화 · 도깨비불",
  climax: "좋다! 그렇게 다 안다면 — 직접 보아라! 이, 이것도 눈속임이라 할 테냐?!",
  onsite: "현장 연출 — 눈앞의 팬 홀로그램에 도깨비불이 타오릅니다.",

  options: [
    { t: "빠르게 도는 빛을 눈이 이어 붙인 잔상", correct: true },
    { t: "마침내 모습을 드러낸 진짜 도깨비", correct: false },
    { t: "불에 타 나타난 유령", correct: false },
  ],

/* 오답 시 도깨비 반응(무작위) — 정답을 흘리지 않고 되묻기 */
const WRONG = [
  "크하하! 거봐라, 홀렸지! …아니라고? 흥, 그럼 다시 골라보아라.",
  "큿… 그렇게 믿고 싶겠지. 허나 그건 아니다. 다시 보아라.",
  "어림없다! 그런 얕은 수로 나를 밝혀내겠다고?"
];

/* 줄다리기 바: 완료 단계 수(0~5)에 따른 '과학' 비율 */
const SCIENCE_PCT = [12, 30, 48, 66, 84, 100];

const PLACEHOLDER_NAME = "국중곽 도깨비 사건 조사대";
const CODE = "DKB-4287"; // TODO: 발급 방식 확정 후 교체

/* =========================================================================
   상태 · 저장  (localStorage — QR로 다시 열어도 진행도 유지)
   ========================================================================= */
const KEY = "gukjunggwak_dokkaebi_v1";
let state = load() || { name: "", stage: "prologue", solved: 0 };

function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function reset(){ localStorage.removeItem(KEY); state = { name:"", stage:"prologue", solved:0 }; render(); }

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 공통 조각 */
function bar(){
  const pct = SCIENCE_PCT[Math.min(state.solved, 5)];
  return `<div class="bar-wrap"><div class="bar-key"><span>미신</span><span class="sci">과학 ${pct===100?'✓':''}</span></div>
    <div class="bar"><span style="width:${pct}%"></span></div></div>`;
}
function topbar(sound){
  return `<div class="top"><p class="brand">기묘한 국중곽 · 21세기 도깨비</p>
    ${sound?'<span class="sound">소리 켜짐</span>':''}</div>`;
}

/* =========================================================================
   화면 렌더
   ========================================================================= */
function render(){
  if(state.stage === "prologue") return renderPrologue();
  if(state.stage === "finale")   return renderFinale();
  if(state.stage === "done")     return renderDone();
  return renderNode(state.stage);
}

function renderPrologue(){
  app.innerHTML = `
    ${topbar(true)}
    <p class="eyebrow">도깨비의 도전장</p>
    <h1 class="title">도깨비가 과학관에<br>찾아왔다</h1>
    <div class="voice"><p>인간들아. 너희가 과학이라는 걸로 세상 이치를 죄다 풀어낸다지. 번개도, 무지개도, 별의 움직임까지… 흥, 건방진 것들.<br><br>오늘 밤, 내가 이 과학관에 네 가지 조화를 부려놓았다. 불빛, 소리, 홀림, 그리고 얼굴. 하나라도 못 풀면, 너는 나에게 홀린 것이야.</p></div>
    <p class="aside">…넷 다 풀거든, 그땐 순순히 물러나마.<br>(딱히 자신 없어서 하는 말은 아니다.)</p>
    <div class="field">
      <p class="flabel">조사단의 이름을 밝혀라</p>
      <input id="name" class="finput" type="text" placeholder="${esc(PLACEHOLDER_NAME)}" value="${esc(state.name)}" />
    </div>
    <button class="cta" onclick="startGame()">첫 번째 조화를 따라간다</button>
    <p class="hint">— 자신 있으면 따라오너라 —</p>`;
}

function startGame(){
  const v = (document.getElementById("name").value || "").trim();
  state.name = v || PLACEHOLDER_NAME;
  state.stage = 0;
  save(); render();
}

function renderNode(i){
  const n = NODES[i];
  app.innerHTML = `
    ${topbar(true)}
    ${bar()}
    <p class="eyebrow">${esc(n.eyebrow)}</p>
    <h1 class="title">${esc(n.title)}</h1>
    <div class="voice"><p>${esc(n.taunt)}</p></div>
    <p class="tale-label">목 격 담</p>
    <p class="tale">${esc(n.tale)}</p>
    ${n.onsite ? `<div class="onsite"><b>현장</b> · ${esc(n.onsite.replace('현장 체험 — ',''))}</div>` : ``}
    <div class="mission">
      <p class="m-q">${esc(n.question)}</p>
      <div id="opts">
        ${n.options.map((o,idx)=>`<button class="opt" data-i="${idx}" onclick="answer(${i},${idx})">${esc(o.t)}</button>`).join("")}
      </div>
    </div>
    <div id="reveal" class="reveal-box">
      <p class="r-label">과 학 의 규 명</p>
      <div class="reveal">${esc(n.reveal)}</div>
      <div class="react"><p>${esc(n.react)}</p></div>
      <p class="next-clue"><b>다음 단서 →</b> ${esc(n.nextClue)}</p>
      <button class="cta" onclick="nextFrom(${i})">다음 지점 도착 · QR 스캔</button>
    </div>
    <div class="spacer"></div>
    <button class="restart" onclick="reset()">처음부터 다시 시작</button>`;
}

function answer(i, idx){
  const isFinale = (i === "F");
  const set = isFinale ? FINALE : NODES[i];
  const btns = document.querySelectorAll("#opts .opt");
  const chosen = set.options[idx];
  if(chosen.correct){
    btns.forEach((b,bi)=>{ b.disabled = true; if(bi===idx) b.classList.add("right"); });
    // 정답 → 완료 카운트 올리고 규명 공개
    state.solved = isFinale ? 5 : Math.max(state.solved, i+1);
    save();
    const rv = document.getElementById("reveal");
    rv.classList.add("show");
    // 줄다리기 바 갱신
    const span = document.querySelector(".bar>span");
    if(span) span.style.width = SCIENCE_PCT[Math.min(state.solved,5)] + "%";
    rv.scrollIntoView({behavior:"smooth", block:"nearest"});
  } else {
    // 오답 → 도깨비가 좋아하며 되묻기, 다시 선택 가능
    const b = btns[idx];
    b.classList.add("wrong");
    b.disabled = true;
    let msg = document.getElementById("wrongmsg");
    if(!msg){
      msg = document.createElement("div");
      msg.id = "wrongmsg"; msg.className = "react"; msg.style.marginTop = "12px";
      document.getElementById("opts").after(msg);
    }
    msg.innerHTML = `<p>${esc(WRONG[Math.floor(Math.random()*WRONG.length)])}</p>`;
  }
}

function nextFrom(i){
  if(i < NODES.length - 1){ state.stage = i+1; }
  else { state.stage = "finale"; }
  save(); render();
}

function renderFinale(){
  app.innerHTML = `
    ${topbar(false)}
    ${bar()}
    <p class="eyebrow">${esc(FINALE.eyebrow)}</p>
    <h1 class="title">도깨비를 마주하다</h1>
    <div class="voice"><p>${esc(FINALE.climax)}</p></div>
    <div class="onsite"><b>현장</b> · ${esc(FINALE.onsite.replace('현장 연출 — ',''))}</div>
    <div class="mission">
      <p class="m-q">${esc(FINALE.question)}</p>
      <div id="opts">
        ${FINALE.options.map((o,idx)=>`<button class="opt" data-i="${idx}" onclick="answer('F',${idx})">${esc(o.t)}</button>`).join("")}
      </div>
    </div>
    <div id="reveal" class="reveal-box">
      <p class="r-label">최 후 의 규 명</p>
      <div class="reveal">${esc(FINALE.reveal)}</div>
      <div class="react"><p>${esc(FINALE.concession)}</p></div>
      <button class="cta" onclick="finish()">담력왕 인증받기</button>
    </div>
    <div class="spacer"></div>
    <button class="restart" onclick="reset()">처음부터 다시 시작</button>`;
}

function finish(){ state.stage = "done"; save(); render(); }

function renderDone(){
  app.innerHTML = `
    ${topbar(false)}
    ${bar()}
    <div class="result">
      <p class="rl">규 명 완 료</p>
      <p class="rt">불빛, 소리, 홀림, 얼굴. 그리고 도깨비불까지. <b>${esc(state.name)}</b>가 네 밤의 조화를 하나도 남김없이 밝혀냈습니다.</p>
    </div>
    <div class="badge">
      <div class="crown">👑</div>
      <p class="bt">담력왕 인증</p>
      <p class="bn">${esc(state.name)}</p>
    </div>
    <div class="code">
      <p class="cl">선물 교환 코드</p>
      <p class="cv">${esc(CODE)}</p>
    </div>
    <p class="gift">체험존 안내데스크에서 이 코드를 보여주세요</p>
    <div class="spacer"></div>
    <button class="restart" onclick="reset()">처음부터 다시 시작</button>`;
}

render();
</script>
</body>
</html>
